<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sahkaar Setu | Documentation</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f7fb;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: white;
      padding: 35px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      color: #173b5f;
      margin-bottom: 8px;
      font-size: 30px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .description {
      color: #666;
      font-size: 14px;
      line-height: 1.6;
      margin: 0 auto 15px;
      max-width: 480px;
    }

    .instruction {
      color: #173b5f;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 22px;
    }

    .section {
      margin-top: 25px;
      margin-bottom: 10px;
      text-align: left;
      font-size: 14px;
      color: #777;
      font-weight: bold;
      text-transform: uppercase;
    }

    .link {
      display: block;
      text-decoration: none;
      color: #173b5f;
      background: #eef5fb;
      padding: 16px;
      margin: 12px 0;
      border-radius: 12px;
      font-weight: bold;
      transition: 0.2s;
    }

    .link:hover {
      transform: translateY(-2px);
      background: #dfeefb;
    }

    footer {
      margin-top: 25px;
      font-size: 12px;
      color: #999;
    }

    @media (max-width: 480px) {
      body {
        padding: 15px;
      }

      .container {
        padding: 28px 20px;
      }

      h1 {
        font-size: 25px;
      }

      .description {
        font-size: 13px;
      }

      .link {
        padding: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>SAHKAAR SETU</h1>

    <p class="subtitle">
      Official Project Documentation
    </p>

    <p class="description">
      Access the official project documents, business model,
      and BHASHINI API approval details.
    </p>

    <p class="instruction">
      👆 Tap any document below to view it
    </p>

    <div class="section">
      Documentation
    </div>

    <a class="link"
       href="https://drive.google.com/file/d/1lmtn6qKj6M2E6z5H-2j1Rr5JjL5wMSG2/view?usp=drivesdk"
       target="_blank"
       rel="noopener noreferrer">
      📘 Master Document
    </a>

    <a class="link"
       href="https://drive.google.com/file/d/1SOm-GePAoFF--VOD9cMyLNfOMv4jyybM/view?usp=drivesdk"
       target="_blank"
       rel="noopener noreferrer">
      💼 Business Model
    </a>

    <a class="link"
       href="https://drive.google.com/file/d/1CGd993sl-h99bfsrv5XBeZmTk_f4pVl1/view?usp=sharing"
       target="_blank"
       rel="noopener noreferrer">
      🔑 BHASHINI API Approval
    </a>

    <footer>
      Smart India Hackathon 2026
    </footer>

  </div>

</body>
</html>
